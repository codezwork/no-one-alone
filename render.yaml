# One-click deploy on Render (render.com): New > Blueprint > point it at this folder's repo.
# The disk keeps the SQLite database across restarts and deploys.
services:
  - type: web
    name: neighbours
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: DATA_DIR
        value: /var/data
      - key: VAPID_SUBJECT
        value: mailto:you@example.com
    disk:
      name: neighbours-data
      mountPath: /var/data
      sizeGB: 1
